name = "decklister"
main = "src/index.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5af9bf2be24dfe756af55b3bbd542e57"
# Served at https://decklister.gpeake.com, a custom domain attached in the dashboard
# (not listed here: `routes` makes `wrangler dev` rewrite Host and Origin). Any other
# address redirects there (src/index.js), so sessions and GAuth's answers line up.

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# The site. Only public/ is served: the rest of the repo is not.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[kv_namespaces]]
binding = "DECKLISTEDITOR"
id = "bb576df04a11477f935a3b59ae24ba18"

# Accounts (src/accounts): Better Auth's tables and protected links. Decks stay in KV.
[[d1_databases]]
binding = "DB"
database_name = "decklister"
database_id = "2403a9a2-05e5-42ca-9866-6acca7daf30e"
migrations_dir = "migrations"

# BETTER_AUTH_SECRET is a secret (wrangler secret put). GAUTH_CERTS is GAuth's SAML
# signing certificate (PEM, from GAuth's app page); list both during a key rotation.
[vars]
APP_ORIGIN = "https://decklister.gpeake.com"
GAUTH_ORIGIN = "https://auth.gpeake.com"
